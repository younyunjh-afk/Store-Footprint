<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지역별 매장 입점 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: map canvas left, region ledger right; region index below. Tokens: land/sea neutrals tinted blue-grey, three brand hues, one AK accent. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2328; --muted:#66707a; --line:#dde1e3;
  --land:#e3e7e2; --landline:#b9c2bc; --sea:#eef2f4;
  --d1:#c9d6e3; --d2:#7f9fc0; --d3:#3f6693; --d4:#1f3f66;
  --ak:#d0461b; --akbg:#fbe9e2; --fac:#e0201b;
  --shiz:#b8325f; --list:#22607a; --sist:#a07418;
  --sel:#111; --ink:#000;
  --up:#1f7a4d; --down:#c0392b;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181b; --panel:#1b2024; --fg:#e7eaec; --muted:#9aa4ad; --line:#2c3338;
  --land:#262d31; --landline:#3d474d; --sea:#171c1f;
  --d1:#34465a; --d2:#4f7299; --d3:#7aa0c9; --d4:#b7d0ea;
  --ak:#ff7a4d; --akbg:#3a2219;
  --shiz:#ef7da2; --list:#6fb6d2; --sist:#e0b45a;
  --sel:#fff; --ink:#fff; --up:#5fd39a; --down:#ff8a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --panel:#1b2024; --fg:#e7eaec; --muted:#9aa4ad; --line:#2c3338;
  --land:#262d31; --landline:#3d474d; --sea:#171c1f;
  --d1:#34465a; --d2:#4f7299; --d3:#7aa0c9; --d4:#b7d0ea;
  --ak:#ff7a4d; --akbg:#3a2219;
  --shiz:#ef7da2; --list:#6fb6d2; --sist:#e0b45a;
  --sel:#fff; --ink:#fff; --up:#5fd39a; --down:#ff8a7a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.86rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.84rem;border:0;background:transparent;color:var(--fg);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.seg button:focus-visible,.chip:focus-visible,.rbtn:focus-visible{outline:2px solid var(--ak);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:stretch}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;min-height:640px}
@media (max-width:860px){.mapbox{min-height:min(110vw,640px)}}
svg#map{display:block;position:absolute;inset:0;width:100%;height:100%}
.land{fill:var(--land);stroke:var(--landline);stroke-width:.6}
.bub{cursor:pointer;stroke:var(--panel);transition:opacity .15s}
.bub:hover{opacity:.85}
.akring{fill:none;stroke:var(--ak);pointer-events:none}
.facdot{fill:var(--fac);stroke:var(--panel);pointer-events:none}
.selring{fill:none;stroke:var(--sel);pointer-events:none}
.lbl{fill:var(--ink);font-family:var(--sans);font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round}
.cnt{fill:var(--ink);font-family:var(--mono);font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.legend{position:absolute;right:10px;top:10px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:1rem;display:grid;gap:4px;color:var(--ink)}
.zctl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zctl button{font:600 1.25rem/1 var(--sans);width:38px;height:38px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.zctl button:hover{background:var(--bg)}
.zctl button:focus-visible{outline:2px solid var(--ak);outline-offset:-2px}
.zctl span{font:500 .72rem var(--mono);color:var(--muted);padding:2px 0;border-block:1px solid var(--line);width:100%;text-align:center}
.zhint{position:absolute;left:10px;bottom:8px;margin:0;font-size:.78rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
svg#map{cursor:grab;touch-action:none}
svg#map.grabbing{cursor:grabbing}
.fstrip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.fstrip h3{margin:0;font-size:1rem;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.fstrip h3 small{font-weight:400;color:var(--muted);font-size:.8rem}
.fstrip tbody tr{cursor:pointer}
.fstrip tbody tr:hover td{background:var(--bg)}
.fstrip tbody tr[aria-current="true"] td{background:var(--akbg)}
.fstrip tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.legend .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.ptitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptitle h2{margin:0;font-size:1.2rem}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--akbg);color:var(--ak)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat b{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--muted)}
.stat.s-shiz{border-color:var(--shiz)}.stat.s-list{border-color:var(--list)}.stat.s-sist{border-color:var(--sist)}
.note{font-size:.82rem;color:var(--muted);margin:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.76rem;font-variant-numeric:tabular-nums}
th{font-size:.7rem;color:var(--muted);font-weight:500;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.grp td{font-weight:700;padding-top:10px;border-bottom:0}
tr.grp .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
tr.akrow td{background:var(--akbg)}
.tag{font-size:.68rem;font-weight:700;color:var(--ak);margin-left:4px}
.out{font-size:.72rem;font-weight:600;color:var(--down);margin-left:2px}
.ch{color:var(--muted);font-size:.74rem;margin-left:4px}
.up{color:var(--up)}.down{color:var(--down)}
.index{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.index h3{margin:0;font-size:.95rem}
.rlist{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.rbtn b{font-family:var(--mono);font-weight:500;font-size:.78rem;color:var(--muted)}
.rbtn.ak{border-color:var(--ak)}
.rbtn[aria-current="true"]{background:var(--fg);color:var(--bg)}
.rbtn[aria-current="true"] b{color:var(--bg)}
@media (prefers-reduced-motion:reduce){.bub{transition:none}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.legend{font-size:.85rem;right:6px;top:6px}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>지역별 매장 입점 현황</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="지도 범위">
        <button id="z-all" aria-pressed="true">전국</button>
        <button id="z-cap" aria-pressed="false">수도권 확대</button>
      </div>
      <div class="seg" role="group" aria-label="유통" id="chSeg">
        <button data-c="" aria-pressed="true">전체 유통</button>
        <button data-c="팩토리아울렛" aria-pressed="false">팩토리아울렛</button>
      </div>
      <div class="seg" role="group" aria-label="브랜드" id="brandSeg">
        <button data-b="" aria-pressed="true">전체</button>
        <button data-b="쉬즈미스" aria-pressed="false">쉬즈미스</button>
        <button data-b="리스트" aria-pressed="false">리스트</button>
        <button data-b="시스티나" aria-pressed="false">시스티나</button>
      </div>
    </div>
  </header>

  <section class="fstrip" id="fstrip" hidden></section>
  <div class="main">
    <div class="mapbox">
      <svg id="map" role="img" aria-label="전국 매장 분포 지도"></svg>
      <div class="zctl" role="group" aria-label="지도 확대 축소"><button id="zin" aria-label="확대" title="확대">+</button><span id="zlevel">100%</span><button id="zout" aria-label="축소" title="축소">−</button></div>
      <p class="zhint">마우스 휠로 확대·축소, 끌어서 이동, 더블클릭 확대</p>
      <div class="legend">
        <div class="row">원 크기: 지역 매장 수</div>
        <div class="row">색: 동일 브랜드 최다 매장 수
          <span class="sw" style="background:var(--d1)"></span>1
          <span class="sw" style="background:var(--d2)"></span>2
          <span class="sw" style="background:var(--d3)"></span>3~4
          <span class="sw" style="background:var(--d4)"></span>5+</div>
        <div class="row"><span class="sw" style="background:var(--fac)"></span>팩토리아울렛</div>
        <div class="row"><span class="sw" style="border:2px solid var(--ak)"></span>AK 입점 지역 · 확대하면 지명이 모두 표시됨</div>
      </div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <section class="index">
    <h3>지역 바로가기</h3>
    <div class="rlist" id="rlist"></div>
  </section>
</div>

const short=r=>{const p=r.split(' ');return (p[1]||p[0]).replace(/(특별자치도|시|군|구)$/,'')||p[1]};

function filt(list){return list.filter(s=>(!brand||s.brand===brand)&&(!ch||s.ch===ch))}
function level(list){const c={};list.forEach(s=>c[s.brand]=(c[s.brand]||0)+1);const m=Math.max(0,...Object.values(c));return m}
function color(m){return m>=5?'var(--d4)':m>=3?'var(--d3)':m===2?'var(--d2)':'var(--d1)'}

const svg=document.getElementById('map');
const AR=full[3]/full[2];
const capV=(()=>{const cx=cap[0]+cap[2]/2,cy=cap[1]+cap[3]/2,w=cap[3]/AR>cap[2]?cap[3]/AR:cap[2];return [cx-w/2,cy-w*AR/2,w,w*AR]})();
let vb=full.slice();
const CAPBOX=cap;
function clampVb(){const minW=full[2]/14;vb[2]=Math.max(minW,Math.min(full[2],vb[2]));vb[3]=vb[2]*AR;
  vb[0]=Math.max(full[0]-vb[2]*0.25,Math.min(full[0]+full[2]-vb[2]*0.75,vb[0]));vb[1]=Math.max(full[1]-vb[3]*0.25,Math.min(full[1]+full[3]-vb[3]*0.75,vb[1]))}
function scale(){return Math.min((svg.clientWidth||600)/vb[2],(svg.clientHeight||560)/vb[3])}
function zr(){return full[2]/vb[2]}
function syncZoomBtns(){const z=zr();document.getElementById('z-all').setAttribute('aria-pressed',z<1.05?'true':'false');document.getElementById('z-cap').setAttribute('aria-pressed',Math.abs(vb[2]-capV[2])<1&&Math.abs(vb[0]-capV[0])<1?'true':'false');document.getElementById('zlevel').textContent=Math.round(z*100)+'%'}
function draw(){
  svg.setAttribute('viewBox',vb.join(' '));
  const sc=scale(), px=v=>v/sc, z=zr(), g=Math.min(2.4,Math.sqrt(z));
  const detail=z>=3;
  svg.innerHTML='';
  const land=document.createElementNS(NS,'path');land.setAttribute('d',D.path);land.setAttribute('class','land');land.setAttribute('stroke-width',px(.8));svg.appendChild(land);
  const items=Object.entries(regions).map(([r,l])=>({r,l:filt(l),xy:D.regs[r]})).filter(o=>o.l.length);
  items.sort((a,b)=>b.l.length-a.l.length);
  const gL=document.createElementNS(NS,'g');
  items.forEach(o=>{
    const n=o.l.length, rpx=(3+Math.sqrt(n)*3.2)*1.1*g, rr=px(rpx);
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',o.xy[0]);c.setAttribute('cy',o.xy[1]);c.setAttribute('r',rr);
    c.setAttribute('class','bub');c.setAttribute('fill',ch==='팩토리아울렛'?'var(--fac)':color(level(o.l)));c.setAttribute('stroke-width',px(1));
    c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label',`${o.r} ${n}개 매장`);
    const t=document.createElementNS(NS,'title');t.textContent=`${o.r} · ${n}개 매장`;c.appendChild(t);
    c.addEventListener('click',e=>{if(dragged){e.preventDefault();return}pick(o.r)});c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o.r)}});
    svg.appendChild(c);
    if(akRegs.has(o.r)&&(!brand||o.l.some(s=>s.ak))){const a=document.createElementNS(NS,'circle');a.setAttribute('cx',o.xy[0]);a.setAttribute('cy',o.xy[1]);a.setAttribute('r',rr+px(2.5));a.setAttribute('class','akring');a.setAttribute('stroke-width',px(2));gL.appendChild(a)}
    if(ch!=='팩토리아울렛'&&o.l.some(s=>s.ch==='팩토리아울렛')){const fd=document.createElementNS(NS,'circle');const a=Math.PI/4;fd.setAttribute('cx',o.xy[0]+rr*Math.cos(a));fd.setAttribute('cy',o.xy[1]-rr*Math.sin(a));fd.setAttribute('r',px(5));fd.setAttribute('class','facdot');fd.setAttribute('stroke-width',px(1.5));const ft=document.createElementNS(NS,'title');ft.textContent='팩토리아울렛 있음';fd.appendChild(ft);gL.appendChild(fd)}
    if(o.r===sel){const s=document.createElementNS(NS,'circle');s.setAttribute('cx',o.xy[0]);s.setAttribute('cy',o.xy[1]);s.setAttribute('r',rr+px(5.5));s.setAttribute('class','selring');s.setAttribute('stroke-width',px(1.8));gL.appendChild(s)}
    const inCap=o.xy[0]>CAPBOX[0]&&o.xy[0]<CAPBOX[0]+CAPBOX[2]&&o.xy[1]>CAPBOX[1]&&o.xy[1]<CAPBOX[1]+CAPBOX[3];
    if(n>=3&&rpx>=8&&(detail||!inCap||n>=10)){const tx=document.createElementNS(NS,'text');tx.setAttribute('x',o.xy[0]);tx.setAttribute('y',o.xy[1]);tx.setAttribute('class','cnt');tx.setAttribute('font-size',px(detail?13:11));tx.setAttribute('stroke-width',px(2.5));tx.textContent=n;gL.appendChild(tx)}
    const showLbl = (detail||ch) ? true : (!inCap&&!/광역시/.test(o.r)&&(n>=4||akRegs.has(o.r)||z>=1.8));
    if(showLbl){const lb=document.createElementNS(NS,'text');const fs=px(detail?13:12);lb.setAttribute('x',o.xy[0]+rr+px(3));lb.setAttribute('y',o.xy[1]+fs*.35);lb.setAttribute('class','lbl');lb.setAttribute('font-size',fs);lb.setAttribute('stroke-width',fs*.28);lb.textContent=short(o.r);gL.appendChild(lb)}
  });
  svg.appendChild(gL);
  syncZoomBtns();
}
let raf=0;function redraw(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
function toSvg(cx,cy){const r=svg.getBoundingClientRect(),sc=scale(),ox=(r.width-vb[2]*sc)/2,oy=(r.height-vb[3]*sc)/2;return [vb[0]+(cx-r.left-ox)/sc,vb[1]+(cy-r.top-oy)/sc]}
function zoomAt(f,p){const w=vb[2]*f;const nw=Math.max(full[2]/14,Math.min(full[2],w));const k2=nw/vb[2];vb[0]=p[0]-(p[0]-vb[0])*k2;vb[1]=p[1]-(p[1]-vb[1])*k2;vb[2]=nw;vb[3]=nw*AR;clampVb();redraw()}
function zoomCenter(f){zoomAt(f,[vb[0]+vb[2]/2,vb[1]+vb[3]/2])}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*0.0015),toSvg(e.clientX,e.clientY))},{passive:false});
const ptrs=new Map();let dragged=false,start=null,pinch0=null;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);dragged=false;start={x:e.clientX,y:e.clientY,vb:vb.slice()};if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),w:vb[2],c:toSvg((a[0]+b[0])/2,(a[1]+b[1])/2)}}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>0){zoomAt((pinch0.w*pinch0.d/d)/vb[2],pinch0.c)}dragged=true;return}
  const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!dragged&&Math.hypot(dx,dy)<5)return;
  if(!dragged){dragged=true;svg.setPointerCapture(e.pointerId);svg.classList.add('grabbing')}
  const sc=scale();vb[0]=start.vb[0]-dx/sc;vb[1]=start.vb[1]-dy/sc;clampVb();redraw()});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;svg.classList.remove('grabbing');if(ptrs.size===0)setTimeout(()=>{dragged=false},0)}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('dblclick',e=>{e.preventDefault();zoomAt(0.5,toSvg(e.clientX,e.clientY))});

function pick(r){sel=r;draw();panel();index();if(typeof fstrip==='function')fstrip();}

function panel(){
  const el=document.getElementById('panel'); const all=regions[sel]||[]; const l=filt(all);
  const cy=l.reduce((a,s)=>a+s.cy,0), py=l.reduce((a,s)=>a+s.py,0);
  const cnt=b=>all.filter(s=>s.brand===b).length;
  let h=`<div class="ptitle"><h2>${sel}</h2>${akRegs.has(sel)?'<span class="badge">AK</span>':''}</div>`;
  h+=`<div class="stats"><div class="stat"><b>${all.length}</b><span>전체 매장</span></div>`+BR.map(b=>`<div class="stat s-${BC[b]}"><b>${cnt(b)}</b><span>${b}</span></div>`).join('')+`</div>`;
  const dups=BR.filter(b=>cnt(b)>=2).map(b=>`${b} ${cnt(b)}개`);
  const pw=l.filter(s=>s.pf!=null),pws=pw.reduce((x,s)=>x+s.cy,0),pfr=pws?pw.reduce((x,s)=>x+s.cy*s.pf,0)/pws:null;
  h+=`<p class="note">${brand?brand+' ':''}당해매출 ${fmt(cy)} · 전년 대비 ${pctTxt(pct(cy,py))} · 매출가중 손익 ${rt(pfr)} · 철수대상 ${l.filter(s=>s.out).length}개${dups.length?' · 동일 브랜드 중복: '+dups.join(', '):' · 동일 브랜드 중복 없음'}</p>`;
  h+=`<div class="tbl"><table><thead><tr><th>매장</th><th>전년</th><th>당해</th><th>증감</th><th>비중</th><th>유통마진</th><th>매니저</th><th>손익</th><th>재고</th></tr></thead><tbody>`;
  (brand?[brand]:BR).forEach(b=>{
    const g=all.filter(s=>s.brand===b&&(!ch||s.ch===ch)).sort((x,y)=>(y.ak-x.ak)||(y.cy-x.cy)); if(!g.length)return;
    const gs=g.reduce((a,s)=>a+s.cy,0);
    h+=`<tr class="grp"><td colspan="9"><span class="dot" style="background:var(--${BC[b]})"></span>${b} ${g.length}개</td></tr>`;
    g.forEach(s=>{const p=pct(s.cy,s.py);h+=`<tr class="${s.ak?'akrow':''}"><td>${s.name}${s.out?'<span class="out">(철수대상)</span>':''}${s.isNew?'<span class="ch">신규</span>':''}${s.ak?'<span class="tag">AK</span>':''}<span class="ch">${s.ch}</span></td><td>${fmt(s.py)}</td><td>${fmt(s.cy)}</td><td class="${p==null?'':p>=0?'up':'down'}">${pctTxt(p)}</td><td>${gs?Math.round(s.cy/gs*100):0}%</td><td>${rt(s.mg)}</td><td>${rt(s.mn)}</td><td class="${s.pf==null?'':s.pf>=0?'up':'down'}">${rt(s.pf)}</td><td>${(s.inv||0).toLocaleString('ko-KR')}</td></tr>`});
  });
  h+=`</tbody></table></div>`;
  el.innerHTML=h;
}

function index(){
  const el=document.getElementById('rlist');
  const ents=Object.entries(regions).map(([r,l])=>({r,n:filt(l).length})).filter(o=>o.n);
  ents.sort((a,b)=>(akRegs.has(b.r)-akRegs.has(a.r))||(b.n-a.n)||a.r.localeCompare(b.r,'ko'));
  el.innerHTML='';
  ents.forEach(o=>{const b=document.createElement('button');b.className='rbtn'+(akRegs.has(o.r)?' ak':'');b.setAttribute('aria-current',o.r===sel?'true':'false');b.innerHTML=`${o.r.replace('특별시','').replace('광역시','').replace('특별자치도','')}${akRegs.has(o.r)?' <span class="tag">AK</span>':''} <b>${o.n}</b>`;b.addEventListener('click',()=>{const xy=D.regs[o.r];vb[2]=full[2]/4;vb[3]=vb[2]*AR;vb[0]=xy[0]-vb[2]/2;vb[1]=xy[1]-vb[3]/2;clampVb();pick(o.r);document.getElementById('panel').scrollIntoView({block:'nearest',behavior:'smooth'})});el.appendChild(b)});
}

document.getElementById('z-all').onclick=()=>{vb=full.slice();draw()};
document.getElementById('zin').onclick=()=>zoomCenter(0.6);
document.getElementById('zout').onclick=()=>zoomCenter(1/0.6);
document.getElementById('z-cap').onclick=()=>{vb=capV.slice();draw()};
document.querySelectorAll('#brandSeg button').forEach(b=>b.onclick=()=>{brand=b.dataset.b;document.querySelectorAll('#brandSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));draw();panel();index();fstrip()});

function fstrip(){
  const el=document.getElementById('fstrip'); el.hidden=!ch; if(!ch){el.innerHTML='';return}
  const l=stores.filter(s=>s.ch===ch&&(!brand||s.brand===brand)).sort((a,b)=>b.cy-a.cy);
  const cy=l.reduce((a,s)=>a+s.cy,0), py=l.reduce((a,s)=>a+s.py,0);
  const pw=l.filter(s=>s.pf!=null),pws=pw.reduce((x,s)=>x+s.cy,0),pfr=pws?pw.reduce((x,s)=>x+s.cy*s.pf,0)/pws:null;
  let h=`<h3>${ch} ${l.length}개 매장<small>행을 누르면 지도에서 해당 지역으로 이동합니다 · 매출 12개월 합계(백만원)</small></h3><div class="tbl"><table><thead><tr><th>매장</th><th>지역</th><th>전년</th><th>당해</th><th>증감</th><th>유통마진</th><th>매니저</th><th>손익</th><th>재고</th></tr></thead><tbody>`;
  l.forEach(s=>{const p=pct(s.cy,s.py);h+=`<tr data-r="${s.reg}" aria-current="${s.reg===sel}" tabindex="0"><td>${s.name}${s.out?'<span class="out">(철수대상)</span>':''}<span class="ch">${s.brand}</span></td><td>${s.reg.replace('특별시','').replace('광역시','')}</td><td>${fmt(s.py)}</td><td>${fmt(s.cy)}</td><td class="${p==null?'':p>=0?'up':'down'}">${pctTxt(p)}</td><td>${rt(s.mg)}</td><td>${rt(s.mn)}</td><td class="${s.pf==null?'':s.pf>=0?'up':'down'}">${rt(s.pf)}</td><td>${(s.inv||0).toLocaleString('ko-KR')}</td></tr>`});
  h+=`</tbody><tfoot><tr><td>합계</td><td></td><td>${fmt(py)}</td><td>${fmt(cy)}</td><td class="${cy>=py?'up':'down'}">${pctTxt(pct(cy,py))}</td><td></td><td></td><td class="${pfr==null?'':pfr>=0?'up':'down'}">${rt(pfr)}</td><td></td></tr></tfoot></table></div>`;
  el.innerHTML=h;
  el.querySelectorAll('tbody tr').forEach(tr=>{const go=()=>{const r=tr.dataset.r,xy=D.regs[r];vb[2]=full[2]/4;vb[3]=vb[2]*AR;vb[0]=xy[0]-vb[2]/2;vb[1]=xy[1]-vb[3]/2;clampVb();pick(r)};tr.addEventListener('click',go);tr.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}})});
}
document.querySelectorAll('#chSeg button').forEach(b=>b.onclick=()=>{ch=b.dataset.c;document.querySelectorAll('#chSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  if(ch){const f=stores.filter(s=>s.ch===ch).sort((a,b)=>b.cy-a.cy);if(f.length&&!f.some(s=>s.reg===sel))sel=f[0].reg}
  draw();panel();index();fstrip()});
draw();panel();index();fstrip();
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(draw,120)});
if(window.ResizeObserver)new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(draw,120)}).observe(svg);
</script>

</body>
</html>
